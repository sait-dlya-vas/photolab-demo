<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHOTO LAB – корпоративная книга</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Плашка демо (убрать в рабочей версии) ===== -->
  <div class="demo-note">
    Демо-прототип: тексты регламентов – примеры. В рабочей версии здесь будут разделы вашей Корпоративной книги.
  </div>

  <!-- ===== Шапка (показывается после входа) ===== -->
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/" aria-label="На главную">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 2v28M2 16h28" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">PHOTO LAB</span>
        <span class="brand-sub">Корпоративная книга</span>
      </span>
    </a>
    <form class="top-search" id="top-search" role="search">
      <input type="search" name="q" placeholder="Поиск по регламентам" aria-label="Поиск по регламентам">
    </form>
    <button class="logout" id="logout" type="button">Выйти</button>
  </header>

  <!-- ===== Сюда выводятся страницы ===== -->
  <main id="app" tabindex="-1"></main>

  <!-- ===== Откуда взяты тексты (Google-таблица или сохранённая копия) ===== -->
  <p class="source" id="source" role="status" hidden></p>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
